<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="card-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Frame Subtle Grid Accents -->
  <circle cx="150" cy="100" r="300" fill="#2563EB" opacity="0.08" filter="blur(60px)" />
  <circle cx="1050" cy="500" r="250" fill="#38BDF8" opacity="0.06" filter="blur(50px)" />

  <!-- Main Display Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="36" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="2" />
  <rect x="60" y="60" width="1080" height="510" rx="36" fill="url(#card-glow)" />

  <!-- Top Accent Ribbon Line -->
  <path d="M 96 60 L 1104 60" stroke="url(#accent-line)" stroke-width="4" stroke-linecap="round" />

  <!-- Left Side: Logo Container Box -->
  <g transform="translate(110, 150)">
    <rect width="210" height="250" rx="32" fill="#0F172A" stroke="#2563EB" stroke-opacity="0.4" stroke-width="2" />
    <circle cx="105" cy="125" r="85" fill="#2563EB" opacity="0.12" />
    
    <!-- Shield DNA Emblem Scaled Inside -->
    <g transform="translate(42, 35) scale(0.63)">
      <!-- Shield Contour -->
      <path d="M 32,55 C 32,55 100,42 100,42 C 100,42 168,55 168,55 C 168,110 156,155 100,198 C 44,155 32,110 32,55 Z" 
            stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Left Strand of DNA Helix -->
      <path d="M 88,32 C 70,52 70,72 100,92 C 130,112 130,132 100,152 C 70,172 70,192 88,212" 
            stroke="#60A5FA" stroke-width="11" stroke-linecap="round" fill="none"/>

      <!-- Right Strand of DNA Helix -->
      <path d="M 112,32 C 130,52 130,72 100,92 C 70,112 70,132 100,152 C 130,172 130,192 112,212" 
            stroke="#38BDF8" stroke-width="11" stroke-linecap="round" fill="none"/>

      <!-- Base Pairs / Rungs -->
      <line x1="88" y1="48" x2="112" y2="48" stroke="#93C5FD" stroke-width="7.5" stroke-linecap="round"/>

      <line x1="86" y1="102" x2="114" y2="102" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
      <line x1="82" y1="112" x2="118" y2="112" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
      <line x1="80" y1="122" x2="120" y2="122" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
      <line x1="82" y1="132" x2="118" y2="132" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
      <line x1="86" y1="142" x2="114" y2="142" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>

      <line x1="88" y1="196" x2="112" y2="196" stroke="#93C5FD" stroke-width="7.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Side: Content & Typography -->
  <!-- Category Pill Badge -->
  <g transform="translate(360, 140)">
    <rect width="320" height="36" rx="18" fill="#1E3A8A" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" />
    <text x="16" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#60A5FA" letter-spacing="2">GENOVA CLINICAL HEALTH AI</text>
  </g>

  <!-- Title -->
  <text x="360" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Genova Health</text>

  <!-- Description Line 1 -->
  <text x="360" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">
    AI-powered digital health platform for personalised health insights,
  </text>
  <!-- Description Line 2 -->
  <text x="360" y="336" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">
    smart tracking, and preventive care.
  </text>

  <!-- Feature Chips Row at Bottom -->
  <g transform="translate(360, 410)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#38BDF8" />
      <text x="38" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Smart NutriScan</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(192, 0)">
      <rect width="170" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#818CF8" />
      <text x="38" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Vitals &amp; Biometrics</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(374, 0)">
      <rect width="180" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#F97316" />
      <text x="38" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Genotype Analysis</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(566, 0)">
      <rect width="150" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#34D399" />
      <text x="38" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Private &amp; Secure</text>
    </g>
  </g>
</svg>
